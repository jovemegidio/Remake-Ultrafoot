name: Desktop Linux and macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux-x64
            args: --config src-tauri/tauri.linux.conf.json
            node: 24
          - platform: macos-14
            name: macos-universal
            args: --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json
            node: 22
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Read game version
        id: gamever
        shell: bash
        run: echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos-universal' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system dependencies
        if: matrix.name == 'linux-x64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: pnpm install --no-frozen-lockfile

      - name: Fetch game assets
        shell: bash
        run: |
          echo "Baixando pacote de assets (escudos, jogadores, uniformes, narração)..."
          curl -fsSL -o game-assets.zip \
            "https://github.com/jovemegidio/Ultrafoot26/releases/download/game-assets/game-assets.zip"
          # unzip/ditto retornam código 1 em AVISOS (não erro fatal); o "|| true"
          # evita que o set -e aborte. Validamos a extração logo abaixo.
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -x -k game-assets.zip . || true
          else
            unzip -q -o game-assets.zip || true
          fi
          rm -f game-assets.zip
          # Confirma que os assets obrigatórios saíram de verdade.
          if [ ! -d public/escudos ] || [ ! -d public/jogadores ]; then
            echo "ERRO: a extração dos assets falhou (public/escudos ou public/jogadores ausente)."
            exit 1
          fi
          echo "Assets extraídos em public/."

      - name: Verify distributable game assets
        run: |
          node scripts/qa-release-assets.mjs

      - name: Build & publish native package
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Sem variáveis APPLE_*: o macOS builda SEM assinatura (grátis). Com elas
          # vazias, o tauri-action tentava importar um certificado inexistente e
          # falhava ("failed to import keychain certificate"). O usuário abre o app
          # com botão direito > Abrir na 1ª vez (Gatekeeper).
        with:
          args: ${{ matrix.args }}
          # Publica num release PRÓPRIO (Linux/macOS), sem tocar no canal do Windows
          # (launcher lê o latest.json do release build-<versao> do Windows).
          tagName: desktop-${{ steps.gamever.outputs.version }}
          releaseName: "Ultrafoot 26 ${{ steps.gamever.outputs.version }} — Linux & macOS"
          releaseBody: "Ultrafoot 26 para Linux (.AppImage e .deb) e macOS. AppImage: baixe, dê permissão de execução e rode."
          releaseDraft: false
          prerelease: false

      - name: Upload packages for QA
        uses: actions/upload-artifact@v4
        with:
          name: ultrafoot-${{ matrix.name }}
          path: |
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
          if-no-files-found: error

      # O "LATEST" DO GITHUB TEM DE APONTAR PARA O RELEASE DO JOGO.
      #
      # O auto-updater le releases/latest/download/latest.json. Só esse release
      # tem esse arquivo — em qualquer outro, o endpoint vira 404 e TODO MUNDO
      # para de receber atualizacao, em silencio.
      #
      # A primeira tentativa foi `--latest=false` neste release. Nao resolve:
      # isso apenas passa o titulo para o PROXIMO release recente, que continua
      # nao sendo o do jogo. Aconteceu de novo na 1.0.19.
      #
      # O que resolve e AFIRMAR o alvo certo: repinar o release do jogo depois de
      # publicar. `if: always()` porque um alvo da matriz que falha nao pode
      # deixar o latest errado.
      - name: Manter o release do jogo como latest
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "desktop-${{ steps.gamever.outputs.version }}" --latest=false --repo "$GITHUB_REPOSITORY" || true
          VERSAO_JOGO=$(node -p "require('./package.json').version")
          gh release edit "build-$VERSAO_JOGO" --latest --repo "$GITHUB_REPOSITORY" || true
          echo "latest agora: $(gh api repos/$GITHUB_REPOSITORY/releases/latest -q .tag_name)"
