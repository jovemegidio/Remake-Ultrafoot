name: Release

# Gera a ÚNICA build oficial do Ultrafoot 26: builda, ASSINA e publica o
# instalador NSIS + latest.json no GitHub Release. O jogo instalado pega essa
# atualização sozinho (tauri-plugin-updater). Assim ninguém precisa gerar .exe
# na mão — evita "build em cima de build" e binários desatualizados.
#
# Como publicar uma versão:
#   1. Bump da versão em package.json E src-tauri/tauri.conf.json
#   2. git commit -am "chore: bump versao X.Y.Z"
#   3. git tag vX.Y.Z && git push origin master --tags
#   O push da tag dispara este workflow.
#
# Segredos necessários (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           conteúdo de ~/.ultrafoot-keys/ultrafoot-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (vazio — a chave foi gerada sem senha)
#   WINDOWS_CERTIFICATE                 PFX Authenticode codificado em Base64
#   WINDOWS_CERTIFICATE_PASSWORD        senha do PFX
# Variável necessária:
#   NEXT_PUBLIC_ULTRAFOOT_RELAY_URL      URL HTTPS do relay público implantado

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # O multiplayer por relay está desligado no jogo (ver ONLINE_RELAY_ENABLED
      # em lib/internet-multiplayer.ts), então o release não depende mais dele.
      # Ao reativar o online, restaure aqui a checagem de /health comparando com
      # ONLINE_PROTOCOL_VERSION — e não com a versão da build, que obrigava um
      # redeploy do relay a cada release.
      - name: Release preflight
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE)) { throw "WINDOWS_CERTIFICATE Authenticode ausente" }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) { throw "WINDOWS_CERTIFICATE_PASSWORD ausente" }

      - name: Import Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "ultrafoot-authenticode.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.HasPrivateKey) { throw "O certificado importado não possui chave privada" }
          @{ bundle = @{ windows = @{ certificateThumbprint = $certificate.Thumbprint; digestAlgorithm = "sha256"; timestampUrl = "http://timestamp.digicert.com" } } } |
            ConvertTo-Json -Depth 5 | Set-Content "src-tauri/tauri.windows.signing.conf.json" -Encoding utf8

      - name: Build, sign & publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NEXT_PUBLIC_ULTRAFOOT_RELAY_URL: ${{ vars.NEXT_PUBLIC_ULTRAFOOT_RELAY_URL }}
        with:
          args: --config src-tauri/tauri.windows.conf.json --config src-tauri/tauri.windows.signing.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: "Ultrafoot 26 ${{ github.ref_name }}"
          releaseBody: "Atualização automática do Ultrafoot 26. O jogo baixa e instala sozinho na próxima abertura."
          releaseDraft: false
          prerelease: false
