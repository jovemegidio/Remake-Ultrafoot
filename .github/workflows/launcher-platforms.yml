name: Launcher (Windows, Linux e macOS)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            name: linux
            args: --config src-tauri/tauri.linux.conf.json
          - platform: macos-14
            name: mac
            args: --target universal-apple-darwin --config src-tauri/tauri.macos.conf.json
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: Launcher/src-tauri

      - name: Read launcher version
        id: ver
        shell: bash
        run: echo "version=$(node -p "require('./Launcher/src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

      - name: Linux system dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install launcher deps
        working-directory: Launcher
        run: pnpm install --no-frozen-lockfile

      - name: Build & publish launcher
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: Launcher
          args: ${{ matrix.args }}
          tagName: launcher-desktop-${{ steps.ver.outputs.version }}
          releaseName: "Ultrafoot Launcher ${{ steps.ver.outputs.version }} (Linux & macOS)"
          releaseBody: "Launcher do Ultrafoot 26 para Linux (.AppImage/.deb) e macOS (.dmg). Baixe, instale e o launcher cuida de baixar/atualizar o jogo."
          releaseDraft: false
          prerelease: false

      # O "LATEST" DO GITHUB TEM DE APONTAR PARA O RELEASE DO JOGO.
      #
      # O auto-updater le releases/latest/download/latest.json. Só esse release
      # tem esse arquivo — em qualquer outro, o endpoint vira 404 e TODO MUNDO
      # para de receber atualizacao, em silencio.
      #
      # A primeira tentativa foi `--latest=false` neste release. Nao resolve:
      # isso apenas passa o titulo para o PROXIMO release recente, que continua
      # nao sendo o do jogo. Aconteceu de novo na 1.0.19.
      #
      # O que resolve e AFIRMAR o alvo certo: repinar o release do jogo depois de
      # publicar. `if: always()` porque um alvo da matriz que falha nao pode
      # deixar o latest errado.
      - name: Manter o release do jogo como latest
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "launcher-desktop-${{ steps.ver.outputs.version }}" --latest=false --repo "$GITHUB_REPOSITORY" || true
          VERSAO_JOGO=$(node -p "require('./package.json').version")
          gh release edit "build-$VERSAO_JOGO" --latest --repo "$GITHUB_REPOSITORY" || true
          echo "latest agora: $(gh api repos/$GITHUB_REPOSITORY/releases/latest -q .tag_name)"
