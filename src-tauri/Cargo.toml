[package]
name = "ultrafoot"
version = "0.1.0"
description = "Ultrafoot 26 - Football Manager"
authors = ["Ultrafoot"]
license = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ultrafoot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
# Mantido apenas para o bundler assinar o instalador (createUpdaterArtifacts -> .sig,
# usado por scripts/publish-release.mjs). O plugin NAO e mais registrado em runtime:
# a atualizacao do jogo agora e feita pelo Ultrafoot Launcher, nao mais in-game.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Noticias reais: o webview aplica CORS e feeds RSS nao liberam. O plugin http
# faz a requisicao no lado nativo, contornando o bloqueio.
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Verificacao da licenca no lado NATIVO. Nao usamos o Ed25519 do Web Crypto
# porque ele so saiu do flag no Chrome 137 e o jogo roda na WebView2 instalada
# na maquina do jogador — em Windows desatualizado a verificacao falharia e o
# COMPRADOR LEGITIMO perderia o registro. Aqui e o mesmo binario para todos.
# `default-features = false` evita puxar rand/getrandom: so verificamos, nunca
# assinamos (assinar e exclusividade do servidor, com a chave privada).
ed25519-dalek = { version = "2", default-features = false }
discord-rich-presence = "0.2"
tiny_http = "0.12"
ureq = { version = "2.12", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Devices_Enumeration",
  "Foundation",
  "Win32_UI_Input_XboxController",
  # SMTC: ler/controlar o player de midia do SISTEMA (Spotify, YouTube, etc).
  # Substitui a trilha embutida de 1,6 GB — o jogo vira controle remoto do que
  # o jogador ja esta ouvindo. Sem login, sem API key, sem Premium.
  "Media_Control",
] }
windows-collections = "0.2.0"
# Localiza o Ultrafoot Launcher no registro para redirecionar o boot do jogo.
winreg = "0.52"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
