[package]
name = "ultrafoot"
version = "0.1.0"
description = "Ultrafoot 26 - Football Manager"
authors = ["Ultrafoot"]
license = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ultrafoot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
discord-rich-presence = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
  "Devices_Enumeration",
  "Foundation",
  "Win32_UI_Input_XboxController",
  # SMTC: ler/controlar o player de midia do SISTEMA (Spotify, YouTube, etc).
  # Substitui a trilha embutida de 1,6 GB — o jogo vira controle remoto do que
  # o jogador ja esta ouvindo. Sem login, sem API key, sem Premium.
  "Media_Control",
] }
windows-collections = "0.2.0"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 4
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
