# pnpm 11 não lê mais o campo "pnpm" do package.json — a config foi movida para cá.
# `packages` é obrigatório no pnpm 9 (CI) quando existe pnpm-workspace.yaml.
packages:
  - .
overrides:
  hono: 4.12.25
allowBuilds:
  # O Next usa sharp na geracao. MSW e apenas uma dependencia transitiva de
  # desenvolvimento e nao precisa executar codigo durante a instalacao.
  sharp: true
  msw: false
