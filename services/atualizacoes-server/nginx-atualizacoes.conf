# Trecho para o server{} do site (ultrafoot.<ip>.sslip.io).
#
# A ORDEM IMPORTA e e o ponto delicado deste arquivo. O nginx escolhe o
# `location` mais especifico: os dois primeiros blocos (painel e admin) tem de
# vir ANTES do bloco geral /atualizacoes/, senao o arquivo estatico ganha e o
# painel nunca responde.
#
# O que e ESTATICO continua estatico: /atualizacoes/elencos.json e as imagens
# sao lidos direto do disco pelo nginx, sem passar por Python. E esse caminho
# que todo jogador percorre, e ele segue funcionando mesmo com o servico
# parado — so o painel cai.

# Painel de administracao (HTML servido pelo proprio servico).
location = /atualizacoes/painel {
    proxy_pass http://127.0.0.1:8792;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# API de administracao e health.
location ~ ^/atualizacoes/(admin/|health) {
    proxy_pass http://127.0.0.1:8792;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Escudo/uniforme viajam em base64 no corpo do POST.
    client_max_body_size 16m;
    proxy_read_timeout 120s;
}

# Imagens: nome = sha256 do conteudo, entao o arquivo NUNCA muda de conteudo.
# Pode ser cacheado para sempre; trocar o escudo gera outro nome.
#
# O `^~` NAO E ENFEITE — sem ele isto aqui nao funciona. O site ja tem um
#
#     location ~* \.(png|jpg|jpeg|webp|gif|svg|woff2|mp3|ogg|mp4)$ { expires 30d; }
#
# e, na ordem do nginx, uma REGEX vence um prefixo comum. Toda requisicao a
# .../atualizacoes/img/<sha>.png cairia naquele bloco, que nao tem alias e
# herda `root /var/www/ultrafoot/current` — ou seja, procuraria o escudo dentro
# do build do jogo e devolveria 404. O modificador `^~` faz o prefixo ganhar da
# regex e encerra a busca aqui.
location ^~ /atualizacoes/img/ {
    alias /var/www/ultrafoot/atualizacoes/img/;
    access_log off;
    expires max;
    add_header Cache-Control "public, immutable";
}

# O manifesto continua sendo servido pelo bloco `location /atualizacoes/` que ja
# existe no site (alias para o mesmo diretorio, com Cache-Control no-cache).
# Nao duplicamos aqui de proposito: dois blocos para o mesmo arquivo e onde
# nasce a divergencia de cabecalho que ninguem consegue explicar depois.
