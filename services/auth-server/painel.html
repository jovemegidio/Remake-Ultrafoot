<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ultrafoot — Painel de administração</title>
<!--
  Painel de administração de contas.

  Página estática: toda autorização acontece no servidor. O que abre a área é a
  coluna `admin` da própria conta — não existe senha de painel nem token mestre
  aqui. Para quem não é admin o servidor responde 404, então nem a existência da
  área vaza.

  O token fica em sessionStorage (some ao fechar a aba), nunca em localStorage:
  este painel costuma ser aberto em máquina compartilhada.
-->
<style>
  :root {
    --bg: #070b0d; --card: #0d1417; --linha: #1b262b;
    --texto: #e6edf0; --fraco: #8b9aa1; --primaria: #48eed6;
    --perigo: #ff6b6b; --ok: #4ade80;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--texto);
    font: 14px/1.5 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
  }
  a { color: var(--primaria); }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 20px; border-bottom: 1px solid var(--linha); background: #080e10;
    position: sticky; top: 0; z-index: 5;
  }
  header h1 { font-size: 15px; margin: 0; letter-spacing: .02em; }
  header .sub { color: var(--fraco); font-size: 12px; }
  main { max-width: 1200px; margin: 0 auto; padding: 22px 20px 60px; }

  .cartao { background: var(--card); border: 1px solid var(--linha); border-radius: 12px; padding: 20px; }
  .entrar { max-width: 380px; margin: 12vh auto; }
  .entrar h2 { margin: 0 0 4px; font-size: 18px; }
  .entrar p { margin: 0 0 18px; color: var(--fraco); font-size: 13px; }

  input, textarea {
    width: 100%; padding: 10px 12px; margin-bottom: 10px;
    background: #050809; color: var(--texto);
    border: 1px solid var(--linha); border-radius: 8px; font: inherit; outline: none;
  }
  input:focus, textarea:focus { border-color: var(--primaria); }

  button {
    padding: 9px 14px; border-radius: 8px; border: 1px solid transparent;
    font: 600 13px/1 inherit; cursor: pointer; background: #16242a; color: var(--texto);
  }
  button:hover { filter: brightness(1.25); }
  button:disabled { opacity: .45; cursor: not-allowed; filter: none; }
  button.principal { background: var(--primaria); color: #04110f; width: 100%; padding: 11px; }
  button.perigo { background: #3a1618; color: var(--perigo); border-color: #58202433; }
  button.leve { background: transparent; border-color: var(--linha); color: var(--fraco); }

  .busca { display: flex; gap: 10px; margin-bottom: 16px; }
  .busca input { margin: 0; }

  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--linha); vertical-align: top; }
  th { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--fraco); font-weight: 700; }
  tbody tr:hover { background: #0f181c; }
  td.acoes { white-space: nowrap; text-align: right; }

  .etiqueta {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 700;
  }
  .et-banida { background: #3a1618; color: var(--perigo); }
  .et-admin  { background: #16242a; color: var(--primaria); }
  .et-google { background: #1a1d2e; color: #9db4ff; }
  .fraco { color: var(--fraco); font-size: 12px; }
  .erro { color: var(--perigo); font-size: 13px; margin: 8px 0 0; min-height: 18px; }
  .vazio { padding: 32px; text-align: center; color: var(--fraco); }

  dialog {
    border: 1px solid var(--linha); border-radius: 12px; background: var(--card);
    color: var(--texto); padding: 20px; max-width: 440px; width: 92%;
  }
  dialog::backdrop { background: rgba(0,0,0,.72); }
  dialog h3 { margin: 0 0 6px; font-size: 16px; }
  .linha-botoes { display: flex; gap: 10px; justify-content: flex-end; margin-top: 6px; }
  .historico { margin: 10px 0 0; padding: 0; list-style: none; font-size: 12px; }
  .historico li { padding: 6px 0; border-bottom: 1px solid var(--linha); }
</style>
</head>
<body>

<div id="tela-login">
  <main>
    <div class="cartao entrar">
      <h2>Painel do Ultrafoot</h2>
      <p>Entre com uma conta de administrador.</p>
      <input id="email" type="email" placeholder="E-mail" autocomplete="username">
      <input id="senha" type="password" placeholder="Senha" autocomplete="current-password">
      <button class="principal" id="btn-entrar">Entrar</button>
      <p class="erro" id="erro-login"></p>
    </div>
  </main>
</div>

<div id="tela-painel" hidden>
  <header>
    <div>
      <h1>Ultrafoot — Administração de contas</h1>
      <div class="sub" id="quem"></div>
    </div>
    <button class="leve" id="btn-sair">Sair</button>
  </header>
  <main>
    <div class="busca">
      <input id="busca" placeholder="Buscar por nome ou e-mail (vazio = todas)">
      <button id="btn-buscar">Buscar</button>
    </div>
    <div class="cartao" style="padding:0; overflow-x:auto">
      <table>
        <thead>
          <tr>
            <th>Conta</th><th>Entrou</th><th>Criada</th>
            <th>Último acesso</th><th>Compras</th><th></th>
          </tr>
        </thead>
        <tbody id="corpo"></tbody>
      </table>
      <div class="vazio" id="vazio" hidden>Nenhuma conta encontrada.</div>
    </div>
    <p class="erro" id="erro-painel"></p>
  </main>
</div>

<dialog id="dlg-banir">
  <h3>Banir conta</h3>
  <p class="fraco" id="banir-quem"></p>
  <textarea id="motivo" rows="3" placeholder="Motivo do banimento (obrigatório)"></textarea>
  <p class="fraco">As sessões abertas dessa conta são derrubadas na hora.</p>
  <p class="erro" id="erro-banir"></p>
  <div class="linha-botoes">
    <button class="leve" id="banir-cancelar">Cancelar</button>
    <button class="perigo" id="banir-confirmar">Banir</button>
  </div>
</dialog>

<dialog id="dlg-historico">
  <h3>Histórico</h3>
  <p class="fraco" id="hist-quem"></p>
  <ul class="historico" id="hist-lista"></ul>
  <div class="linha-botoes">
    <button class="leve" id="hist-fechar">Fechar</button>
  </div>
</dialog>

<script>
// A mesma origem serve o painel e faz proxy do /auth: caminho relativo evita
// cravar o IP aqui e quebrar de novo se o servidor mudar de endereco.
const BASE = "/auth"
const CHAVE = "ultrafoot-painel:token"

const $ = (id) => document.getElementById(id)
const pegarToken = () => sessionStorage.getItem(CHAVE) || ""

async function chamar(rota, corpo) {
  const r = await fetch(BASE + rota, {
    method: "POST",
    headers: { "Content-Type": "application/json", Authorization: "Bearer " + pegarToken() },
    body: JSON.stringify(corpo || {}),
  })
  const dado = await r.json().catch(() => ({}))
  if (!r.ok) {
    // 404 em /admin/* significa "voce nao e admin" — o servidor esconde a area
    // de proposito. Traduzimos para uma mensagem que faca sentido para quem le.
    if (r.status === 404 && rota.startsWith("/admin/")) {
      throw new Error("esta conta nao tem permissao de administrador")
    }
    throw new Error(dado.erro || "falha na requisicao")
  }
  return dado
}

const data = (seg) => seg ? new Date(seg * 1000).toLocaleString("pt-BR") : "—"

// ─── Login ───────────────────────────────────────────────────────────────────

async function entrar() {
  $("erro-login").textContent = ""
  $("btn-entrar").disabled = true
  try {
    const r = await fetch(BASE + "/login", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: $("email").value.trim(), senha: $("senha").value, dispositivo: "painel-admin" }),
    })
    const d = await r.json().catch(() => ({}))
    if (!r.ok) throw new Error(d.erro || "nao foi possivel entrar")
    sessionStorage.setItem(CHAVE, d.token)
    $("quem").textContent = d.email
    await abrirPainel()
  } catch (e) {
    $("erro-login").textContent = e.message
  } finally {
    $("btn-entrar").disabled = false
  }
}

function sair() {
  chamar("/sair", {}).catch(() => {})
  sessionStorage.removeItem(CHAVE)
  $("tela-painel").hidden = true
  $("tela-login").hidden = false
  $("senha").value = ""
}

// ─── Lista de contas ─────────────────────────────────────────────────────────

async function abrirPainel() {
  await carregar()
  $("tela-login").hidden = true
  $("tela-painel").hidden = false
}

async function carregar() {
  const { contas } = await chamar("/admin/contas", { busca: $("busca").value.trim() })
  const corpo = $("corpo")
  corpo.textContent = ""
  $("vazio").hidden = contas.length > 0

  for (const c of contas) {
    const tr = document.createElement("tr")

    const tdConta = document.createElement("td")
    const nome = document.createElement("div")
    nome.style.fontWeight = "600"
    nome.textContent = c.nome || "(sem nome)"
    const email = document.createElement("div")
    email.className = "fraco"
    email.textContent = c.email
    tdConta.append(nome, email)
    if (c.bloqueada) {
      const et = document.createElement("span")
      et.className = "etiqueta et-banida"
      et.textContent = "BANIDA"
      const motivo = document.createElement("div")
      motivo.className = "fraco"
      motivo.textContent = c.motivo_bloqueio + " · " + data(c.bloqueada_em)
      tdConta.append(document.createElement("br"), et, motivo)
    }
    if (c.admin) {
      const et = document.createElement("span")
      et.className = "etiqueta et-admin"
      et.textContent = "ADMIN"
      tdConta.append(" ", et)
    }

    const tdVia = document.createElement("td")
    const via = document.createElement("span")
    via.className = "etiqueta " + (c.via_google ? "et-google" : "et-admin")
    via.textContent = c.via_google ? "Google" : "Senha"
    tdVia.append(via)

    const tdCriada = document.createElement("td"); tdCriada.className = "fraco"
    tdCriada.textContent = data(c.criada_em)
    const tdUltimo = document.createElement("td"); tdUltimo.className = "fraco"
    tdUltimo.textContent = data(c.ultimo_login)
    const tdCompras = document.createElement("td")
    tdCompras.textContent = c.compras

    const tdAcoes = document.createElement("td"); tdAcoes.className = "acoes"
    const bHist = document.createElement("button")
    bHist.className = "leve"; bHist.textContent = "Histórico"
    bHist.onclick = () => verHistorico(c)
    tdAcoes.append(bHist, " ")
    if (!c.admin) {
      const b = document.createElement("button")
      if (c.bloqueada) {
        b.textContent = "Desbanir"
        b.onclick = () => desbanir(c)
      } else {
        b.className = "perigo"; b.textContent = "Banir"
        b.onclick = () => pedirBanimento(c)
      }
      tdAcoes.append(b)
    }

    tr.append(tdConta, tdVia, tdCriada, tdUltimo, tdCompras, tdAcoes)
    corpo.append(tr)
  }
}

// ─── Banir / desbanir ────────────────────────────────────────────────────────

let alvo = null

function pedirBanimento(conta) {
  alvo = conta
  $("banir-quem").textContent = conta.nome ? conta.nome + " — " + conta.email : conta.email
  $("motivo").value = ""
  $("erro-banir").textContent = ""
  $("dlg-banir").showModal()
}

async function confirmarBanimento() {
  $("erro-banir").textContent = ""
  try {
    await chamar("/admin/banir", { conta_id: alvo.id, motivo: $("motivo").value.trim() })
    $("dlg-banir").close()
    await carregar()
  } catch (e) {
    $("erro-banir").textContent = e.message
  }
}

async function desbanir(conta) {
  try {
    await chamar("/admin/desbanir", { conta_id: conta.id })
    await carregar()
  } catch (e) {
    $("erro-painel").textContent = e.message
  }
}

async function verHistorico(conta) {
  $("hist-quem").textContent = conta.email
  const lista = $("hist-lista")
  lista.textContent = ""
  try {
    const { historico } = await chamar("/admin/historico", { conta_id: conta.id })
    if (!historico.length) {
      const li = document.createElement("li")
      li.className = "fraco"; li.textContent = "Nenhuma ação registrada."
      lista.append(li)
    }
    for (const h of historico) {
      const li = document.createElement("li")
      li.textContent = data(h.quando) + " · " + h.acao + " · " + h.admin_email + (h.motivo ? " · " + h.motivo : "")
      lista.append(li)
    }
  } catch (e) {
    const li = document.createElement("li"); li.className = "fraco"; li.textContent = e.message
    lista.append(li)
  }
  $("dlg-historico").showModal()
}

// ─── Ligações ────────────────────────────────────────────────────────────────

$("btn-entrar").onclick = entrar
$("senha").onkeydown = (e) => { if (e.key === "Enter") entrar() }
$("btn-sair").onclick = sair
$("btn-buscar").onclick = () => carregar().catch(e => { $("erro-painel").textContent = e.message })
$("busca").onkeydown = (e) => { if (e.key === "Enter") $("btn-buscar").click() }
$("banir-cancelar").onclick = () => $("dlg-banir").close()
$("banir-confirmar").onclick = confirmarBanimento
$("hist-fechar").onclick = () => $("dlg-historico").close()

// Sessao ainda viva nesta aba: pula o login. Se o token nao valer mais, cai
// para a tela de login em vez de mostrar painel vazio.
if (pegarToken()) {
  abrirPainel().catch(() => { sessionStorage.removeItem(CHAVE) })
}
</script>
</body>
</html>
